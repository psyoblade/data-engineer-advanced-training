services:
  fluentd:
    container_name: fluentd
    image: psyoblade/data-engineer-fluentd:3.1
    user: root
    stdin_open: true
    tty: true
    ports:
      - 8080-8088:8080-8088
    volumes:
      - ./fluent.conf:/fluentd/etc/fluent.conf
      - ./fluent-ext.conf:/fluentd/etc/fluent-ext.conf
    working_dir: /home/root
    environment:
      - TZ=Asia/Seoul

networks:
  default:
    name: day2_ex4_network
