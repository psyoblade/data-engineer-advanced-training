version: '3'

services:
  fluentd:
    container_name: fluentd
    image: psyoblade/data-engineer-fluentd:3.1
    user: root
    tty: true
    ports:
      - 24224:24224
    volumes:
      - ./fluent.conf:/fluentd/etc/fluent.conf
    entrypoint: [ "/home/root/fluentd" ]
    working_dir: /home/root

networks:
  default:
    name: day2_quiz5_network
